name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - run: npm run generate
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - run: npm run generate
      - run: npm run lint:check

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The handler export shape broke dev before; prove the built server boots and renders.
      - name: Smoke test production server
        run: |
          npm start &
          for i in $(seq 1 15); do
            curl -fs http://127.0.0.1:3000/health && curl -fs http://127.0.0.1:3000/ | grep -q "<html" && exit 0
            sleep 1
          done
          exit 1
