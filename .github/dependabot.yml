version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint supports only typescript <6.1 (TS 7 has no JS compiler API).
      # Drop this once typescript-eslint's peer range allows newer TypeScript.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      all-dependencies:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all-actions:
        patterns:
          - "*"
